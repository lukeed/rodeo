[package]
name = "rodeo-hc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "hc"

[features]
testing = ["dep:tempfile"]

[dependencies]
base64 = "0.22.1"
bytes = "1.12.1"
futures-util = { version = "0.3.34", features = ["sink"] }
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = { version = "3.27.0", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["rt", "sync", "io-util", "macros", "net", "process", "time"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
rodeo-hc = { path = ".", features = ["testing"] }

[lints]
workspace = true
