name: www

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "mise.toml"
      - ".github/workflows/www.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: The release tag to build the site from
        required: true
        type: string
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

concurrency:
  group: www

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: www
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # A site change between releases must not publish an unreleased version, help text or config.
      - name: Use the released crate files
        if: ${{ !inputs.ref }}
        working-directory: .
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "no release tag yet; building from this commit"
            exit 0
          fi
          echo "crate files from $tag"
          git checkout "$tag" -- Cargo.toml crates/rodeo/src/cli.rs crates/config/src/default.toml
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: bun
          cache: false
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - run: bun run lint
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: www
          packageManager: bun
          command: deploy
