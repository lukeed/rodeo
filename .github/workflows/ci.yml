name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["www/**"]
  pull_request:
    paths-ignore: ["www/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  HC_VERSION: 0.1.18

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rust zig mr-boxington jactionlint shellcheck
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: jactionlint
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            hc_target: linux-x86_64
            hc_sha256: 5b2f97cb4b2a9d7a6b2cc5942628203ed9fbb7cc0c2b4b09ad8a6f5648e246b7
          # macos-26 ships Xcode 26.4, whose SDK zig 0.15.2 (pinned by libghostty-vt-sys) cannot link against.
          - os: macos-15
            hc_target: macos-aarch64
            hc_sha256: 77d8af092e25ae650f4424d6dad27514f6916a11d807fb0752858cd27c21e4fc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rust zig mr-boxington aqua:nextest-rs/nextest/cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - if: runner.os == 'macOS'
        run: brew install tmux
      - name: install hc
        shell: bash
        env:
          HC_TARGET: ${{ matrix.hc_target }}
          HC_SHA256: ${{ matrix.hc_sha256 }}
        run: |
          curl -fsSL "https://releases.herdr.dev/core/$HC_VERSION/herdr-core-$HC_TARGET.tar.gz" -o "$RUNNER_TEMP/hc.tar.gz"
          echo "$HC_SHA256  $RUNNER_TEMP/hc.tar.gz" | shasum -a 256 -c
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/hc.tar.gz" -C "$RUNNER_TEMP" herdr-core
          install -m 755 "$RUNNER_TEMP/herdr-core" "$HOME/.local/bin/herdr-core"
          ln -sf herdr-core "$HOME/.local/bin/hc"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: hc --version
      - run: cargo nextest run --workspace --locked --no-fail-fast
