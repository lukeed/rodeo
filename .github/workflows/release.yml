name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, such as v0.1.0
        required: true

permissions:
  contents: read

concurrency:
  group: release

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
  TAG: ${{ inputs.tag || github.ref_name }}
  HC_MIN: 0.1.18

defaults:
  run:
    shell: bash

jobs:
  cli:
    name: cli ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          # macos-26 ships Xcode 26.4, whose SDK zig 0.15.2 (pinned by libghostty-vt-sys) cannot link against.
          - { os: macos-15, target: aarch64-apple-darwin, run: true }
          - { os: macos-15, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true, run: true }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rust zig mr-boxington github:rust-cross/cargo-zigbuild
          cache: false

      - name: Check the tag matches the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rodeo") | .version')
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match rodeo $version"; exit 1; }

      - run: rustup target add "$TARGET"

      - name: Build
        env:
          ZIG: ${{ matrix.zig }}
        run: |
          if [ "$ZIG" = true ]; then
            cargo zigbuild --release --locked -p rodeo --target "$TARGET"
          else
            cargo build --release --locked -p rodeo --target "$TARGET"
          fi

      - name: Smoke test
        if: matrix.run
        run: |
          file "$CARGO_TARGET_DIR/$TARGET/release/rodeo"
          "$CARGO_TARGET_DIR/$TARGET/release/rodeo" --version

      # The archive holds the executable alone, at its root, so that a
      # consumer reading `bin` from the packslip finds it where it says.
      - name: Package
        env:
          COPYFILE_DISABLE: 1
        run: |
          archive="rodeo-$TARGET.tar.gz"
          mkdir -p dist
          tar -czf "dist/$archive" -C "$CARGO_TARGET_DIR/$TARGET/release" rodeo
          cd dist && shasum -a 256 "$archive" > "$archive.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: cli
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          fi
          gh release upload "$TAG" dist/* --clobber

      # Signs the archives and their digests with this workflow's identity, so
      # an installer can verify what it downloads instead of trusting a name.
      - uses: jdx/packslip@44e50e5f64551234b4a382d991bd7f7f7d021d06 # v1.11.3
        with:
          artifacts: dist/*.tar.gz
          bin: rodeo
          require: bin:hc@${{ env.HC_MIN }}
          tag: ${{ env.TAG }}
          commit: ${{ steps.source.outputs.commit }}

  r2:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      # The S3 API, unlike the REST API, honors the token's bucket scope: key = token id, secret = sha256(token).
      - name: Upload to R2
        env:
          R2: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com/rodeo-releases
          R2_KEY: ${{ vars.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          secret=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1)
          echo "::add-mask::$secret"
          s3() { curl -sS --retry 3 --aws-sigv4 'aws:amz:auto:s3' --user "$R2_KEY:$secret" "$@"; }
          put() {
            sum=$(sha256sum "$1" | cut -d' ' -f1)
            s3 --fail -o /dev/null -H "x-amz-content-sha256: $sum" -T "$1" "$R2/$2"
          }

          for file in dist/*; do
            put "$file" "$TAG/${file##*/}"
          done

          code=$(s3 -o current -w '%{http_code}' -H 'x-amz-content-sha256: UNSIGNED-PAYLOAD' "$R2/latest")
          case $code in
            200) current=$(cat current) ;;
            404) current="" ;;
            *) echo "::error::could not read latest from R2: HTTP $code"; exit 1 ;;
          esac
          # A run for an older tag never moves latest back.
          newest=$(printf '%s\n%s\n' "$current" "$TAG" | sort -V | tail -n 1)
          if [ "$newest" != "$TAG" ]; then
            echo "latest stays at $current, which is newer than $TAG"
            exit 0
          fi
          printf '%s\n' "$TAG" > latest
          put latest latest

  homebrew:
    needs: r2
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lukeed/homebrew-tap
          # A write deploy key on the tap only, which only v* tags can read through the release environment.
          ssh-key: ${{ secrets.HOMEBREW_TAP_SSH_KEY }} # jactionlint ignore=checkout-static-credentials
          path: tap
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true

      - name: Write the formula
        run: |
          args=(-e "s|{{version}}|${TAG#v}|g")
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-musl x86_64-unknown-linux-musl; do
            sha=$(cut -d' ' -f1 "dist/rodeo-$target.tar.gz.sha256")
            [ "${#sha}" -eq 64 ] || { echo "::error::no sha256 for $target"; exit 1; }
            args+=(-e "s|{{sha256 $target}}|$sha|g")
          done
          sed "${args[@]}" .github/rodeo.rb.tmpl > tap/Formula/rodeo.rb
          if grep -n '{{' tap/Formula/rodeo.rb; then
            echo "::error::the formula has unfilled placeholders"
            exit 1
          fi
          ruby -c tap/Formula/rodeo.rb

      - name: Push the formula
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/rodeo.rb
          if git diff --cached --quiet; then
            echo "Formula/rodeo.rb is unchanged"
            exit 0
          fi
          git commit -m "chore: rodeo ${TAG#v}"
          git push

  # The site goes out last, so it never names a release that installers cannot fetch yet.
  site:
    needs: homebrew
    permissions:
      contents: read
    uses: ./.github/workflows/www.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
